[project]
name = "enterprise-ai-research-agent"
version = "1.0.0"
description = "LangGraph research agent combining hybrid RAG over documents with guarded text-to-SQL on PostgreSQL."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a PostgreSQL server (TEST_DATABASE_URL)",
    "models: downloads and runs Hugging Face models (RUN_MODEL_TESTS=1)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/File() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
"app/llm/prompts.py" = ["E501"]  # prompt text reads better unwrapped
