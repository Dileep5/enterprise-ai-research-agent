name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retail_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app scripts tests

      - name: Unit tests
        run: pytest tests/unit -q --cov=app --cov-report=term-missing

      - name: PostgreSQL integration tests
        run: pytest tests/integration -q -m postgres

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-v1

      - name: Real-model retrieval tests + offline retrieval eval
        env:
          RUN_MODEL_TESTS: "1"
        run: |
          pytest tests/integration -q -m models
          python -m scripts.evaluate --mode retrieval
